name: Cloudflare preview validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cloudflare/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix cloudflare --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run check:cloudflare-preview
